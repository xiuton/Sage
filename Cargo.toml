[package]
name = "sage"
version = "0.1.0"
edition = "2024"

[features]
default = []
api = ["axum", "hyper", "tokio", "uuid", "tower", "async-stream"]
tools = []
web = ["reqwest"]
full = ["api", "tools", "web"]

[dependencies]
burn = { version = "0.19", features = ["train", "wgpu", "dataset", "ndarray"] }
burn-ndarray = "0.19"
burn-wgpu = "0.19"
burn-autodiff = "0.19"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
tokenizers = "0.19"
ctrlc = "3.4"
indicatif = "0.17"
parking_lot = "0.12"
num_cpus = "1.16"
image = "0.24"
rustyline = "10.0"
reqwest = { version = "0.11", features = ["json", "blocking"], optional = true }
axum = { version = "0.7", optional = true }
hyper = { version = "1.0", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tower = { version = "0.4", features = ["make"], optional = true }
async-stream = { version = "0.3", optional = true }
log = "0.4"

[dev-dependencies]
tempfile = "3.8"
reqwest = { version = "0.11", features = ["json"] }
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "gen_data"
path = "src/bin/gen_data.rs"

[[bin]]
name = "api_server"
path = "src/bin/api_server.rs"
required-features = ["api"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "accuracy_eval"
path = "src/bin/accuracy_eval.rs"

[[bin]]
name = "export"
path = "src/bin/export.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "convert"
path = "src/bin/convert.rs"

[[bin]]
name = "image_gen"
path = "src/bin/image_gen.rs"

[[example]]
name = "multimodal_quickstart"
path = "examples/multimodal_quickstart.rs"
